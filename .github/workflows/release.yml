name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="grove_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$out"
          go build -ldflags "-s -w -X github.com/aymenkrifa/grove/cmd.version=${GITHUB_REF_NAME}" -o "dist/$out/grove" .
          go build -ldflags "-s -w -X github.com/aymenkrifa/grove/cmd.version=${GITHUB_REF_NAME}" -o "dist/$out/git-grove" ./cmd/git-grove
          cp README.md LICENSE "dist/$out/"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
